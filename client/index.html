<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slash Ghost Duel</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0c10;
        color: #fff;
        font-family: Arial, sans-serif;
      }
      #menu {
        position: absolute;
        top: 16px;
        left: 16px;
        padding: 12px;
        background: rgba(0,0,0,0.6);
        border: 1px solid #1f2833;
        border-radius: 8px;
        z-index: 10;
      }
      #hud {
        position: absolute;
        top: 16px;
        right: 16px;
        padding: 8px 12px;
        background: rgba(0,0,0,0.5);
        border-radius: 8px;
        font-size: 14px;
        z-index: 9;
      }
      .row { margin-bottom: 8px; }
      label { display: block; margin-bottom: 4px; }
      input, select, button { width: 220px; padding: 6px; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="menu">
      <div class="row">
        <label>Name</label>
        <input id="playerName" value="Ronin" />
      </div>
      <div class="row">
        <label>Mode</label>
        <select id="mode">
          <option value="A">Mode A - Loop Echo</option>
          <option value="B">Mode B - Lag Shadow</option>
          <option value="C">Mode C - Mana Shadow</option>
        </select>
      </div>
      <div class="row">
        <label>Server URL</label>
        <input id="serverUrl" />
      </div>
      <button id="playBtn">Play</button>
      <p style="margin-top:8px;font-size:12px;line-height:1.4;">Controls: WASD move, Mouse aim, LMB hold to charge, release to slash, RMB shield, Shift dash, G ghost, T toggle ghost (Mode C)</p>
    </div>
    <div id="hud">Connecting...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
